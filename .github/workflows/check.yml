name: VPN Gate Node Check

# 模板仓库默认不配置定时任务：需要自动更新时，把下面的注释替换成你自己的 cron。
# 注意：GitHub 调度最小间隔约 5 分钟，但通常会延迟几分钟；仓库连续 60 天无提交会让定时任务自动停用。
#
# on:
#   schedule:
#     - cron: '*/30 * * * *'

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      max_nodes:
        description: '最多检测多少个节点（0 = 全部）'
        required: false
        default: '0'
      concurrency:
        description: '并发数（建议 16–32）'
        required: false
        default: '32'
      timeout:
        description: '单节点检测超时（秒）'
        required: false
        default: '25'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate worker secret
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          if [ -z "${DOMAIN}" ]; then
            echo "::error::未配置检测地址。请在仓库 Settings → Secrets and variables → Actions 中新增 Secret：DOMAIN（只填 Worker 的 host，例如 abc.workers.dev）"
            exit 1
          fi
          echo "检测域名已配置：${DOMAIN}"

      - name: Load SUB entry addresses only
        run: |
          python - <<'PY'
          import base64
          import ipaddress
          import os
          from urllib.parse import parse_qs, urlsplit

          import requests
          import vpngate

          placeholder = "00000000-0000-4000-8000-000000000000"

          def entry_addresses(text):
              endpoints = []
              seen = set()
              decoded = base64.b64decode("".join(text.split()), validate=True).decode("utf-8")
              for line in decoded.splitlines():
                  try:
                      node = urlsplit(line.strip())
                      if node.scheme != "vless" or node.username != placeholder:
                          continue
                      if parse_qs(node.query).get("host") != ["example.com"]:
                          continue
                      host = (node.hostname or "").rstrip(".")
                      if not host or host == "localhost" or host.endswith(".localhost") or host.startswith("127."):
                          continue
                      try:
                          address = ipaddress.ip_address(host)
                      except ValueError:
                          address = None
                      mapped = getattr(address, "ipv4_mapped", None)
                      if address and (address.is_loopback or address.is_unspecified or (mapped and mapped.is_loopback)):
                          continue
                      host_port = f"[{host}]:{node.port or 443}" if ":" in host else f"{host}:{node.port or 443}"
                      endpoint = vpngate.normalize_endpoint(host_port)
                      if endpoint and endpoint not in seen:
                          seen.add(endpoint)
                          endpoints.append(endpoint)
                  except ValueError:
                      continue
              return endpoints

          try:
              response = requests.get(
                  "https://google.sosorg.nyc.mn/sub",
                  params={"host": "example.com", "uuid": placeholder},
                  headers={"User-Agent": "v2rayN/gate-entry-pool"},
                  timeout=25,
              )
              response.raise_for_status()
              endpoints = entry_addresses(response.text)
              if not endpoints:
                  raise ValueError("no valid entry addresses")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write("EDGE_HOSTS=" + ",".join(endpoints) + "\n")
              print(f"Loaded {len(endpoints)} SUB entry addresses; upstream names ignored; landing names retained")
          except Exception as exc:
              print(f"::warning::SUB entry addresses unavailable ({type(exc).__name__}); using the built-in entry pool")
          PY

      - name: Run pipeline
        env:
          CHECK_WORKER: "https://${{ secrets.DOMAIN }}/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: ${{ github.event.inputs.concurrency || '32' }}
          CHECK_TIMEOUT: ${{ github.event.inputs.timeout || '25' }}
          MAX_CHECK_NODES: ${{ github.event.inputs.max_nodes || '0' }}
          MIN_SUCCESS_RATIO: '0'
        run: python vpngate.py

      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "${api}")
          echo "GET ${api} -> ${status}"

          if [ "${status}" = "200" ]; then
            echo "GitHub Pages 已启用"
            exit 0
          fi

          if [ "${status}" = "404" ]; then
            # 创建站点必须用 POST，且 workflow 构建类型不接受 source 字段
            create=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' -X POST \
              "${auth[@]}" -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "${api}")
            echo "POST ${api} -> ${create}"
            case "${create}" in
              201|204|409)
                echo "GitHub Pages 已启用（或已存在），等待生效"
                sleep 10
                exit 0
                ;;
              *)
                echo "::error::自动启用 Pages 失败（HTTP ${create}）。请打开仓库 Settings → Pages，把 Source 选为 GitHub Actions，然后重新运行本工作流。"
                cat /tmp/pages-create.json 2>/dev/null || true
                exit 1
                ;;
            esac
          fi

          echo "::error::查询 Pages 状态失败（HTTP ${status}），请检查仓库 Pages 设置或工作流权限。"
          cat /tmp/pages.json 2>/dev/null || true
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          echo "订阅地址：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
          echo "仪表盘：  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
